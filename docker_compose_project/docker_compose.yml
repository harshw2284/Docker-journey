services:
  web:
    build: .
    container_name: flask_app
    ports:
      - "5000:5000"
    environment:
      DB_HOST: mysql
      DB_NAME: mydatabase
      DB_USER: appuser
      DB_PASSWORD: appassword
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
        
      mysql:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: redis_cache
    restart: unless-stopped
    ports:
      - "6379:6379"

  mysql:
    image: mysql:8.0
    container_name: mysql_server
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpasswd
      MYSQL_DATABASE: mydatabase
      MYSQL_USER: appuser
      MYSQL_PASSWORD: appassword
    volumes:
      - app-volume:/var/lib/mysql
    healthcheck: 
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"] 
      interval: 10s 
      timeout: 5s 
      retries: 5 
      start_period: 20s  

volumes:
  app-volume:
