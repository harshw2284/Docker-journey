<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todos</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-inner">
        <h1 class="logo">todos<span class="dot">.</span></h1>
        <span id="counter" class="counter">0 left</span>
      </div>
    </header>

    <main class="main">
      <form id="todo-form" class="input-row">
        <input
          id="todo-input"
          type="text"
          class="input"
          placeholder="What needs doing?"
          autocomplete="off"
          maxlength="120"
        />
        <button type="submit" class="btn-add" aria-label="Add todo">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
        </button>
      </form>

      <div class="filters">
        <button class="filter active" data-filter="all">All</button>
        <button class="filter" data-filter="active">Active</button>
        <button class="filter" data-filter="completed">Done</button>
      </div>

      <ul id="todo-list" class="todo-list"></ul>

      <div id="empty-state" class="empty hidden">
        <svg viewBox="0 0 64 64" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="32" cy="32" r="28"/>
          <path d="M22 32h20M32 22v20" stroke-linecap="round"/>
        </svg>
        <p>Nothing here yet.</p>
      </div>

      <div id="error-banner" class="error-banner hidden"></div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
